<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060C18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tandem</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%2344C8EA'/><text x='32' y='44' font-size='36' text-anchor='middle' font-family='Arial' font-weight='700' fill='%230A0F16'>T</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060C18; --bar:#0C1628; --bar2:#101D34; --panel:#111E35; --panel2:#15253F; --card:#18294A; --card2:#1F3358; --row:#142440; --row2:#182B4B;
  --line:#26395C; --line2:#34507C; --text:#F1F5FB; --muted:#B3C1D8; --dim:#8A9BB8;
  --red:#FF4757; --redS:#3E0E17; --redT:#2A0A12; --amber:#FFB020; --amberS:#3D2A06; --amberT:#261A04; --green:#2EE58A; --greenS:#0B3A25; --greenT:#08251A;
  --c-waiting:#7C83FF; --c-laser:#22D8F5; --c-brake:#3D8BFF; --c-fab:#B065FF; --c-qc:#FF4FC8; --c-ship:#19D4B4; --c-office:#9FB0CC; --c-map:#F1F5FB;
  --st:#22D8F5;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sh:0 1px 0 rgba(255,255,255,.04) inset, 0 8px 22px rgba(0,0,0,.35);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body[data-area=waiting],.a-waiting{--st:var(--c-waiting)} body[data-area=laser],.a-laser{--st:var(--c-laser)} body[data-area=brake],.a-brake{--st:var(--c-brake)}
body[data-area=fab],.a-fab{--st:var(--c-fab)} body[data-area=qc],.a-qc{--st:var(--c-qc)} body[data-area=ship],.a-ship{--st:var(--c-ship)}
body[data-area=office],.a-office{--st:var(--c-office)} body[data-area=map],body[data-area=none]{--st:#22D8F5} body[data-area=hold]{--st:var(--red)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--st) 10%, transparent), transparent 60%), var(--bg);background-attachment:fixed;color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.mono{font-family:var(--mono)} .muted{color:var(--muted)} .dim{color:var(--dim)}
.cyan{color:var(--st)} .st{color:var(--st)} .red{color:var(--red)} .amber{color:var(--amber)} .green{color:var(--green)}
a{color:var(--st)}

/* ===== top bar: station rail ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;padding:12px 20px;background:linear-gradient(90deg, color-mix(in srgb, var(--st) 22%, var(--bar)) 0%, var(--bar) 55%);border-bottom:4px solid var(--st);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.logo{width:46px;height:46px;border-radius:10px;background:var(--st);color:#04121A;display:grid;place-items:center;font-weight:900;font-size:23px;flex:none;border:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--st) 35%, transparent)}
.brand small{display:block;color:var(--st);font-weight:800;font-size:12px;letter-spacing:.04em}
.brand b{display:block;font-size:19px;font-weight:800}
.top .title{flex:1;text-align:center;font-weight:900;font-size:30px;letter-spacing:.02em;text-transform:uppercase}
.top .title small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.live{font-family:var(--mono);font-size:14px;color:var(--muted);white-space:nowrap}
.live i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:0;box-shadow:0 0 10px var(--green)}
.live.off i{background:var(--red);box-shadow:0 0 10px var(--red)}
.who{display:flex;align-items:center;gap:8px;background:color-mix(in srgb, var(--st) 18%, var(--card));border:2px solid var(--st);border-radius:10px;padding:8px 12px;font-weight:800;font-size:15px}
.who button{background:none;border:none;color:var(--text);font-size:13px;padding:0 0 0 8px;text-decoration:underline}

/* ===== station switcher ===== */
.nav{display:flex;gap:8px;padding:10px 20px;background:var(--bar2);border-bottom:1px solid var(--line);overflow-x:auto}
.nav a{--c:var(--c-office);flex:1;min-width:128px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text);background:var(--card);border:2px solid color-mix(in srgb, var(--c) 45%, var(--line));border-bottom:5px solid var(--c);border-radius:10px;padding:13px 10px;font-weight:800;font-size:16px;white-space:nowrap}
.nav a[data-a=map]{--c:#E7EEF8} .nav a[data-a=laser]{--c:var(--c-laser)} .nav a[data-a=brake]{--c:var(--c-brake)} .nav a[data-a=fab]{--c:var(--c-fab)} .nav a[data-a=qc]{--c:var(--c-qc)} .nav a[data-a=ship]{--c:var(--c-ship)} .nav a[data-a=waiting]{--c:var(--c-waiting)}
.nav a.on{background:var(--c);color:#04121A;border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent), 0 8px 18px rgba(0,0,0,.35)}
.nav a .n{font-family:var(--mono);font-weight:700;background:color-mix(in srgb, var(--c) 25%, transparent);border-radius:6px;padding:1px 8px;font-size:14px}
.nav a.on .n{background:rgba(4,18,26,.18)}

/* ===== page band ===== */
.band{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;background:linear-gradient(90deg, color-mix(in srgb, var(--st) 30%, var(--panel)), color-mix(in srgb, var(--st) 8%, var(--panel)));border-bottom:1px solid color-mix(in srgb, var(--st) 45%, var(--line))}
.band .bt{font-size:clamp(26px,3.2vw,40px);font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.band .bs{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px}
.band .stat{background:rgba(4,12,24,.45);border:1px solid color-mix(in srgb, var(--st) 45%, transparent);border-radius:10px;padding:8px 14px;text-align:center}
.band .stat b{display:block;font-family:var(--mono);font-size:24px;line-height:1.1}
.band .stat span{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em}

/* ===== banners ===== */
.banner{display:flex;align-items:center;gap:14px;padding:14px 20px;font-weight:800;font-size:18px;border-bottom:3px solid}
.banner.attn{background:linear-gradient(90deg,#5A3A00,var(--amberS));color:#FFD27A;border-color:var(--amber)}
.banner.stop{background:linear-gradient(90deg,#5E0F1C,var(--redS));color:#FFD6DA;border-color:var(--red)}
.banner.done{background:linear-gradient(90deg,#0B4A30,var(--panel));color:#C9FBE3;border-color:var(--green)}
.banner.done button.undo{background:#fff;color:#8A1020;border-color:#fff}
main.qc.qcfull #qcDwg{position:fixed;inset:0;z-index:60;border-radius:0;border:0;overflow:auto;background:#fff}
main.qc.qcfull .sheet{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:62;max-height:58vh;overflow:auto}
main.qc.qcfull #qcDwg{max-height:none}
@media (min-width:861px){ main.qc.qcfull.hassheet #qcDwg{right:370px} main.qc.qcfull.hassheet .qcgrid .sheet{position:fixed;top:0;right:0;bottom:0;left:auto;width:370px;max-height:none;border-radius:0} main.qc.qcfull.hassheet .qcfullbar{right:380px} }
.qcfullbar{position:fixed;top:10px;right:10px;z-index:63;display:flex;gap:8px;align-items:center}
.qcfullbar .mono{background:#04121A;color:#fff;border-radius:8px;padding:8px 10px;font-weight:800}
.sigpad{background:#fff;border-radius:10px;border:3px solid var(--st);touch-action:none;width:100%;height:190px;display:block}
.pribbon{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pribbon button{min-height:54px;padding:0 18px;border-radius:12px;border:2px solid var(--line2);background:var(--card2);font-weight:900;font-size:16px}.pribbon button.on{background:var(--st);color:#04121A;border-color:var(--st)}.pribbon button:disabled{opacity:.4}.pribbon small{font-family:var(--mono);margin-left:6px}
.dwg:fullscreen{overflow:auto;border-radius:0;border:0;background:#fff}
.swipehint{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.banner.turn{background:linear-gradient(90deg, color-mix(in srgb, var(--st) 35%, var(--panel)), var(--panel));color:#fff;border-color:var(--st)}
.banner .meta{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:500;opacity:.9;white-space:nowrap}
.banner button{background:rgba(0,0,0,.25);border:2px solid currentColor;color:inherit;border-radius:8px;padding:8px 14px;font-weight:800;font-size:14px;min-height:42px}

main{padding:18px 20px}
.wrap{max-width:1560px;margin:0 auto}
h1{font-size:42px;font-weight:900;margin:0 0 12px;letter-spacing:.01em}
h2{font-size:22px;font-weight:900;margin:0 0 12px}
h3{font-size:15px;font-weight:800;margin:0 0 10px;color:var(--muted)}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--sh)}
.sec{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh)}
.sec>.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:linear-gradient(90deg, color-mix(in srgb, var(--st) 34%, var(--panel2)), color-mix(in srgb, var(--st) 10%, var(--panel2)));border-bottom:2px solid var(--st)}
.sec>.sh h2{margin:0;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.sec>.sb{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.lbl{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:3px;letter-spacing:.03em;text-transform:uppercase}
.val{font-family:var(--mono);font-size:21px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kv>div{background:rgba(4,12,24,.35);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

/* ===== badges ===== */
.bdg{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line2);border-radius:7px;padding:4px 9px;font-size:12.5px;font-weight:900;letter-spacing:.03em;max-width:100%;background:rgba(4,12,24,.4);color:var(--text)}
.bdg.red{border-color:var(--red);color:#fff;background:var(--red)}
.bdg.amber{border-color:var(--amber);color:#2A1A00;background:var(--amber)}
.bdg.green{border-color:var(--green);color:#03261A;background:var(--green)}
.bdg.cyan,.bdg.st{border-color:var(--st);color:#04121A;background:var(--st)}
.bdg.ol{background:transparent;border-color:var(--st);color:var(--st)}
.bdgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ===== cards with rails ===== */
.card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:12px;padding:14px 16px 14px 20px;text-align:left;width:100%;display:block;color:var(--text);text-decoration:none;box-shadow:var(--sh);overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--st)}
.card[data-href]{cursor:pointer}
.card.hot{background:linear-gradient(180deg,#5A1220,#3A0C16);border-color:var(--red)}
.card.hot::before,.card.red::before{background:var(--red)}
.card.red{background:linear-gradient(180deg,#3E121C,var(--redT));border-color:#8A2432}
.card.amber{background:linear-gradient(180deg,#3E2C0A,var(--amberT));border-color:#7A5610}
.card.amber::before{background:var(--amber)}
.card.green{background:linear-gradient(180deg,#0E3A28,var(--greenT));border-color:#1F7A52}
.card.green::before{background:var(--green)}
.card.cyan{border-color:var(--st);box-shadow:0 0 0 2px color-mix(in srgb, var(--st) 40%, transparent)}
.card .no{font-family:var(--mono);font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.card .part{color:var(--st);font-weight:900;font-size:17px;margin-top:3px}
.card.hot .part,.card.red .part{color:#FFB3BC} .card.amber .part{color:#FFD27A} .card.green .part{color:#8FF5C4}
.card .cq{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--muted);margin-top:6px}.card .cq b{font-size:36px;color:#fff;font-weight:800;margin-left:4px;line-height:1}.card .cq span{font-size:13px;color:var(--st)}
.qtybox{text-align:center;background:rgba(4,12,24,.55);border:2px solid #fff;border-radius:14px;padding:10px 22px;min-width:150px}.qtybox .lbl{color:#fff}.qtybox b{display:block;font-family:var(--mono);font-size:clamp(64px,9vw,110px);line-height:1;font-weight:800}.qtybox span{font-family:var(--mono);font-weight:800;font-size:16px}
.whosteps{display:grid;gap:6px}.whostep{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(4,12,24,.45);font-size:17px}.whostep.done{background:rgba(34,211,238,.10)}.whostep.now{outline:2px solid var(--cyan)}.whostep i{font-style:normal;font-weight:900;color:var(--muted)}.whostep.done i{color:var(--green)}.whostep b{font-size:17px}.whostep .w{font-family:var(--mono);font-size:14px;color:var(--muted);text-align:right}
.card .sub{font-family:var(--mono);font-size:14.5px;color:var(--muted);margin-top:6px}
.card .note{background:rgba(4,12,24,.45);border-left:3px solid var(--st);border-radius:6px;padding:10px 12px;margin-top:12px;font-weight:700;font-size:15.5px}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.card .corner{position:absolute;top:12px;right:12px}
.card .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.card .acts .btn{flex:1}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:12px;border:2px solid var(--line2);background:var(--card2);color:var(--text);font-weight:900;font-size:16px;letter-spacing:.02em;text-decoration:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.st,.btn.cyan{background:var(--st);border-color:var(--st);color:#04121A}
.btn.white{background:#F4F7FB;border-color:#F4F7FB;color:#08111F}
.btn.green{background:var(--green);border-color:var(--green);color:#03261A}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#2A1A00}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ol{background:transparent;border-color:var(--st);color:var(--st);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.huge{min-height:clamp(120px,20vh,230px);font-size:clamp(22px,2.3vw,40px);border-radius:14px;width:100%;white-space:normal;text-align:center;line-height:1.1;padding:0 14px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.huge svg{width:44px;height:44px}

/* ===== station ===== */
.station{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.now{border:3px solid var(--st);border-radius:16px;padding:18px;background:linear-gradient(180deg, color-mix(in srgb, var(--st) 16%, var(--panel2)), var(--panel));box-shadow:0 0 0 4px color-mix(in srgb, var(--st) 14%, transparent), var(--sh)}
.now.hotnow{border-color:var(--red);background:linear-gradient(180deg,#4A0E1A,var(--panel));box-shadow:0 0 0 4px rgba(255,71,87,.2), var(--sh)}
.now .nh{display:flex;align-items:center;gap:12px}
.now .nh h1{margin:0;font-size:46px;letter-spacing:.04em}
.now .card .no{font-size:52px}
.now .card .part{font-size:24px}
.court-wrap{border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb, var(--st) 45%, var(--line));background:var(--panel);box-shadow:var(--sh)}
.court-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(90deg, color-mix(in srgb, var(--st) 40%, var(--panel2)), color-mix(in srgb, var(--st) 12%, var(--panel2)));border-bottom:3px solid var(--st)}
.court-head h1{margin:0;font-size:28px;letter-spacing:.03em}
.court{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:14px}
.upstream{margin:0 14px 14px;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(90deg, color-mix(in srgb, var(--up,#9FB0CC) 30%, var(--panel2)), var(--panel2));border-left:6px solid var(--up,#9FB0CC)}
.upstream b{display:block;font-size:17px}
.empty{border:2px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:18px;background:rgba(4,12,24,.3)}

/* ===== map ===== */
.map{display:grid;grid-template-columns:repeat(6,minmax(225px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{border-radius:14px;min-height:62vh;background:linear-gradient(180deg, color-mix(in srgb, var(--st) 12%, var(--panel)), var(--panel) 40%);border:1px solid color-mix(in srgb, var(--st) 40%, var(--line));overflow:hidden;box-shadow:var(--sh)}
.col .ch{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--st);color:#04121A;font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.col .ch .n{font-family:var(--mono);background:rgba(4,18,26,.2);border-radius:6px;padding:1px 8px;font-size:15px}
.col .cb{padding:10px}
.col .card{margin-bottom:10px;padding:12px 12px 12px 17px}
.col .card .no{font-size:24px}
.col .card .part{font-size:14.5px}
.col .card .sub{font-size:13px}
.card[draggable=true]{cursor:grab}
.card.drop{outline:3px dashed #fff}
.arr{display:flex;gap:6px;margin-top:10px}
.arr .btn{flex:1;min-height:40px}

/* ===== tables / component records ===== */
table{width:100%;border-collapse:separate;border-spacing:0 5px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:800;padding:4px 12px;letter-spacing:.04em;text-transform:uppercase}
td{background:var(--row);padding:13px 12px;font-size:15.5px;vertical-align:middle;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr:nth-child(odd) td{background:var(--row2)}
td:first-child{border-radius:9px 0 0 9px;border-left:1px solid var(--line)} td:last-child{border-radius:0 9px 9px 0;border-right:1px solid var(--line)}
.tscroll{overflow-x:auto}
.comp{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(0,2fr) minmax(170px,1.2fr) auto;gap:16px;align-items:center;padding:14px 16px 14px 22px;border-radius:12px;background:linear-gradient(90deg, color-mix(in srgb, var(--st) 14%, var(--card)), var(--card));border:1px solid color-mix(in srgb, var(--st) 40%, var(--line));margin-bottom:10px;position:relative;overflow:hidden}
.comp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--st)}
.comp.done{--st:var(--green)} .comp.blocked{--st:var(--red)} .comp.warn{--st:var(--amber)} .comp.idle{--st:#6F819F}
.bar{height:12px;border-radius:6px;background:rgba(4,12,24,.6);overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ===== folder hero ===== */

<script>
/* ================= TANDEM floor app ================= */
const SB_URL = 'https://dnnctrlgxxsulbzphthp.supabase.co';

const S = { user:null, member:null, stations:[], st:{}, folders:[], fById:{}, jobs:[], jById:{}, units:[], alerts:[], notes:[], hw:[], acks:[], workers:[], avg:{}, online:true, loaded:false };

const $ = (sel, el=document) => el.querySelector(sel);

function pd(d){ if(!d) return null; const [y,m,dd] = String(d).slice(0,10).split('-').map(Number); return new Date(y, m-1, dd); }
function day(d){ const x = pd(d); return x ? x.toLocaleDateString('en-US',{month:'short',day:'2-digit'}).toUpperCase() : '—'; }
function hm(ts){ return ts ? new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}) : ''; }

function frac(v){ if (v==null || isNaN(v)) return ''; const neg = v < 0; v = Math.abs(v); let n = Math.round(v*32), w = Math.floor(n/32), r = n%32, d = 32; while (r && r%2===0){ r/=2; d/=2; } return (neg?'-':'') + (r===0 ? `${w}` : w===0 ? `${r}/${d}` : `${w} ${r}/${d}`) + '"'; }

async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
const icon = {
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>',

  warn:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  stop:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"/><path d="M12 7v6M12 16.5h.01"/></svg>',
};

/* ---------- data ---------- */
async function load(){
  const q = await Promise.all([
    sb.from('tandem_stations').select('*').order('sort'),
    sb.from('tandem_v_folders').select('*').neq('status','cancelled'),
    sb.from('tandem_v_jobs').select('*').neq('status','cancelled'),
    sb.from('tandem_v_units').select('*').neq('current_stage','complete'),
    sb.from('tandem_alerts').select('*').is('acked_at', null).order('created_at',{ascending:false}).limit(300),
    sb.from('tandem_notes').select('*').is('cleared_at', null).order('created_at',{ascending:false}).limit(400),
    sb.from('tandem_hardware').select('*'),
    sb.from('tandem_hot_acks').select('*'),
    sb.from('tandem_workers').select('id,name,username,role,home_area,active,has_pin,areas').eq('active', true).order('name'),
  ]);
  const bad = q.find(r => r.error); if (bad) throw bad.error;
  [S.stations, S.folders, S.jobs, S.units, S.alerts, S.notes, S.hw, S.acks, S.workers] = q.map(r => r.data || []);
  S.st = Object.fromEntries(S.stations.map(s => [s.id, s]));
  S.fById = Object.fromEntries(S.folders.map(f => [f.id, f]));
  S.jById = Object.fromEntries(S.jobs.map(j => [j.id, j]));
  S.loaded = true;
}
async function loadAvg(){
  const { data } = await sb.from('tandem_v_stage_times').select('stage,part_no,minutes').not('minutes','is',null).limit(5000);
  const acc = {};
  for (const r of data || []) { const m = Math.min(Number(r.minutes), 2880); for (const k of [r.stage, r.stage+'|'+r.part_no]) { (acc[k] ||= [0,0]); acc[k][0]+=m; acc[k][1]++; } }
  S.avg = Object.fromEntries(Object.entries(acc).map(([k,[s,n]]) => [k, s/n]));
}
let reloadT;
function scheduleReload(){ clearTimeout(reloadT); reloadT = setTimeout(async () => { try { await load(); render('live'); } catch(e){ console.error(e); } }, 350); }
function subscribe(){
  const ch = sb.channel('tandem-live');
  for (const t of ['tandem_folders','tandem_jobs','tandem_units','tandem_alerts','tandem_notes','tandem_hardware','tandem_hot_acks','tandem_stage_events','tandem_qc_inspections','tandem_job_changes'])
    ch.on('postgres_changes', { event:'*', schema:'public', table:t }, scheduleReload);
  ch.subscribe(st => { S.online = st === 'SUBSCRIBED'; document.querySelectorAll('.live').forEach(el => el.classList.toggle('off', !S.online)); });
}

/* ---------- derived ---------- */
const areaOf = stage => (S.st[stage] || {}).owner || 'office';
function unitsOf(jobId){ return S.units.filter(u => u.job_id === jobId && u.disposition !== 'scrap'); }
function piecesIn(jobId, area){ return unitsOf(jobId).filter(u => u.area === area).reduce((n,u) => n + (u.pieces||1), 0); }
function sortJobs(list){
  return list.slice().sort((a,b) => (b.hot?1:0)-(a.hot?1:0) || (a.priority??1000)-(b.priority??1000) || String(a.promised_date||'9999').localeCompare(String(b.promised_date||'9999')) || String(a.folder_job_number).localeCompare(String(b.folder_job_number)));
}
function jobsIn(area){ const ids = new Set(S.units.filter(u => u.area === area && u.disposition !== 'scrap').map(u => u.job_id)); return sortJobs(S.jobs.filter(j => ids.has(j.id))); }
function areaCount(area){ return jobsIn(area).length; }
function openAlerts(area, kinds){ return S.alerts.filter(a => (!area || a.area === area || a.area === 'all') && (!kinds || kinds.includes(a.kind))); }
function holdKind(jobId){
  const held = unitsOf(jobId).filter(u => u.on_hold);
  if (!held.length) return null;
  if (held.some(u => (u.hold_reason||'').startsWith('QC fail'))) return 'QC FAIL';
  if (held.some(u => (u.hold_reason||'').startsWith('Drawing rev'))) return 'ON HOLD · REV CHANGE';
  return 'ON HOLD';
}
function badges(j, area){
  const out = [];
  if (j.hot) out.push(['HOT','red']);
  const hk = holdKind(j.id); if (hk) out.push([hk,'red']);
  if (j.needs_po) out.push(['GO-AHEAD · PO PENDING','amber']);
  if (openAlerts(null,['rev_hold']).some(a => a.job_id === j.id && a.area === 'laser')) out.push(['REPROGRAM','amber']);
  if (j.hardware_short) out.push(['HARDWARE SHORT','amber']);
  if (j.remakes_open > 0) out.push(['REMAKE','amber']);
  if (area === 'qc') out.push(j.is_batch ? ['FIRST ARTICLE','cyan'] : ['EVERY PIECE','']);
  if (j.is_batch) out.push(['BATCH OF ' + j.qty, '']);
  else if (area) { const n = piecesIn(j.id, area); if (n && n !== j.qty) out.push([n + ' OF ' + j.qty, '']); }
  return out;
}
function tone(j){ const b = badges(j); if (b.some(x => x[1]==='red')) return 'red'; if (b.some(x => x[1]==='amber')) return 'amber'; return ''; }
const bdgHtml = list => list.length ? `<div class="bdgs">${list.map(([t,c]) => `<span class="bdg ${c}">${esc(t)}</span>`).join('')}</div>` : '';
function stationNote(jobId, area){ return S.notes.find(n => n.kind==='note' && n.job_id===jobId && (!area || n.area===area || n.area==='all')); }
function attention(area){ return S.notes.find(n => n.kind==='attention' && (n.area===area || n.area==='all')); }
function etaMinutes(j, targetArea){
  // minutes until the least-advanced unit of this sub-job reaches targetArea's first stage
  const order = S.stations.map(s => s.id);
  const target = S.stations.find(s => s.owner === targetArea); if (!target) return null;
  const us = unitsOf(j.id).filter(u => (S.st[u.current_stage]||{}).sort < target.sort); if (!us.length) return 0;
  const u = us.sort((a,b) => b.stage_sort - a.stage_sort)[0];
  let total = 0;
  for (let i = order.indexOf(u.current_stage)+1; i <= order.indexOf(target.id); i++) {
    const s = order[i]; const m = S.avg[s+'|'+j.part_no] ?? S.avg[s]; if (m == null) return null; total += m;
  }
  return total;
}
function etaText(j, area){ const m = etaMinutes(j, area); if (m == null) return null; if (m === 0) return 'Here now'; const t = new Date(Date.now() + m*60000); return 'ETA ' + (m > 600 ? t.toLocaleDateString('en-US',{weekday:'short'}) + ' ' : '') + hm(t); }

/* ---------- worker sessions (PIN once per shift, per station) ---------- */
function session(area){ const s = store.get('session.'+area); if (s && new Date(s.expires) > new Date()) return s; return null; }
async function needSession(area){

function pinLogin(area, opts={}){
  return new Promise(resolve => {

    let pick = null, pin = '';
    const close = v => { $('#modal').innerHTML = ''; resolve(v); };
    const draw = () => {
      $('#modal').innerHTML = `<div class="modal"><div class="dlg">
        ${!pick ? `<h2>${opts.leadsOnly ? 'Lead sign-in' : 'Who is working ' + esc(AREAS[area] || area) + '?'}</h2>
          ${sorted.length ? `<div class="people">${sorted.map(w => `<button data-w="${w.id}">${esc(w.name)}</button>`).join('')}</div>`
            : `<div class="empty">No ${opts.leadsOnly ? 'leads' : 'workers'} with a PIN yet. Add them under Workers.</div>`}`
        : `<h2>${esc(pick.name)}</h2><div class="muted">Enter your PIN</div>
          <div class="pins">${[0,1,2,3,4,5].slice(0, Math.max(4, pin.length)).map(i => `<i class="${i < pin.length ? 'f' : ''}"></i>`).join('')}</div>
          <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="back">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--cyan);color:#06222C">OK</button></div>`}
        <div class="row" style="margin-top:16px"><button class="btn ghost" data-x>Cancel</button>${pick ? '<button class="btn ghost" data-b>Back</button>' : ''}</div>
      </div></div>`;
    };
    draw();
    $('#modal').onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.x !== undefined) return close(null);
      if (b.dataset.b !== undefined) { pick = null; pin = ''; return draw(); }
      if (b.dataset.w) { pick = sorted.find(w => w.id === b.dataset.w); pin = ''; return draw(); }
      const k = b.dataset.k; if (!k) return;
      if (k === 'back') pin = pin.slice(0,-1);
      else if (k !== 'ok' && pin.length < 6) pin += k;
      if (k === 'ok' || pin.length === 6) {
        try {
          const r = await rpc('tandem_login', { p_worker: pick.id, p_pin: pin, p_area: area });
          if (!r.ok) { toast(r.error, 'bad'); pin = ''; return draw(); }
          const s = { token: r.token, name: r.name, role: r.role, worker: pick.id, expires: new Date(Date.now() + 11.5*3600e3).toISOString() };
          if (!opts.noStore) store.set('session.'+area, s);
          toast('Signed in: ' + r.name, 'ok'); close(s); render();
        } catch (err) { toast(errMsg(err), 'bad'); pin = ''; draw(); }
        return;
      }
      draw();
    };
  });
}

function ask({ title, body='', fields=[], ok='Save', okClass='cyan' }){
  return new Promise(resolve => {
    $('#modal').innerHTML = `<div class="modal"><form class="dlg" novalidate>
      <h2>${esc(title)}</h2>${body}
      ${fields.map(f => `<label style="display:block;margin-top:12px"><div class="lbl">${esc(f.label)}</div>
        ${f.type==='textarea' ? `<textarea class="txt" name="${f.name}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`
        : f.type==='select' ? `<select class="txt" name="${f.name}">${f.options.map(o => `<option value="${esc(o[0])}" ${o[0]===f.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`
        : `<input class="txt" name="${f.name}" type="${f.type||'text'}" inputmode="${f.inputmode||''}" value="${esc(f.value||'')}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">`}</label>`).join('')}
      <div class="row" style="margin-top:18px"><button type="button" class="btn ghost" data-x>Cancel</button><span class="sp"></span><button class="btn ${okClass}">${esc(ok)}</button></div>
    </form></div>`;
    const form = $('#modal form');
    form.onsubmit = e => { e.preventDefault(); const v = Object.fromEntries(new FormData(form));
      const miss = fields.find(f => f.required && !String(v[f.name]||'').trim()); if (miss) { toast(miss.label + ' is required', 'bad'); return; }
      $('#modal').innerHTML = ''; resolve(v); };
    $('#modal [data-x]').onclick = () => { $('#modal').innerHTML = ''; resolve(null); };
    const first = form.querySelector('input,textarea,select'); if (first) first.focus();
  });
}

const INTERNAL = { nested:'PROGRAMMED', laser_in:'CUTTING', cut:'READY TO BEND', brake_in:'BENDING', bent:'FABRICATE', fab_in:'FABRICATE', hardware:'READY FOR QC', qc:'MEASURING', ready_to_ship:'READY TO SHIP', drawn:'DRAWN', po:'PO ENTERED' };
function internalStatus(j, area){
  const us = unitsOf(j.id).filter(u => u.area === area);
  if (!us.length) return null;
  const count = {}; for (const u of us) { let k = INTERNAL[u.current_stage] || (u.stage_name||'').toUpperCase();
    if (u.current_stage === 'fab_in' && S.hw.some(h => h.job_id === j.id)) k = 'INSTALL HARDWARE';
    count[k] = (count[k]||0) + (u.pieces||1); }
  return Object.entries(count).sort((a,b) => b[1]-a[1])[0][0];
}
function cardState(j, area){
  if (j.hot) return 'hot';
  const t = tone(j); if (t) return t;
  if (area === 'ship' || (j.pieces_done||0) >= j.qty) return 'green';
  return '';
}
function jobCard(j, area, opts={}){

  const fabDone = area === 'fab' ? unitsOf(j.id).filter(u => u.current_stage === 'hardware').reduce((a,u) => a + (u.pieces||1), 0) : 0;
  const areaCls = area && area !== 'office' ? 'a-' + area : 'a-office';
  return `<article class="card ${st} ${areaCls}" data-href="#/job/${j.id}" ${opts.drag ? `draggable="true" data-drag="${j.folder_id}"` : ''}>

async function startScanner(area){
  await stopScanner();
  if (!window.Html5Qrcode) { toast('Camera scanner did not load. Type the code instead.', 'bad'); return; }
  scanner = new Html5Qrcode('reader', { verbose:false });
  try {
    await scanner.start({ facingMode:'environment' }, { fps:10, qrbox:(w,h) => { const m = Math.floor(Math.min(w,h)*0.7); return { width:m, height:m }; } },
      code => { if (code === lastScan.code && Date.now() - lastScan.at < 4000) return; lastScan = { code, at:Date.now() }; area === 'lookup' ? doLookup(code) : doScan(area, code); });
  } catch (e) { $('#reader').innerHTML = `<div class="empty" style="margin:20px">Camera unavailable: ${esc(errMsg(e))}. Type the code at right.</div>`; }
}
async function stopScanner(){ if (scanner) { try { await scanner.stop(); } catch {} try { scanner.clear(); } catch {} scanner = null; } }
async function doScan(area, code){
  const box = $('#scanResult'); if (!box) return;
  const s = await needSession(area); if (!s) return;
  const cart = ($('#cart')?.value || '').trim(); store.set('cart.'+area, cart);
  box.className = 'result'; box.innerHTML = '<div class="lbl">Checking</div><div class="big">' + esc(code) + '</div>';
  try {
    const r = await rpc('tandem_scan', { p_qr: code, p_area: area, p_token: s.token, p_cart: cart || null });
    box.className = 'result ok';
    box.innerHTML = `<span class="bdg green">DONE</span><div class="big">${esc(r.unit)}</div><div style="font-size:20px;font-weight:700">${esc(r.from)} → ${esc(r.to)}</div>
      <div class="muted" style="margin-top:6px">${esc(r.by)} · ${hm(new Date())}${r.handoff ? ' · ' + esc(AREAS[r.handoff]) + ' has been told it is their turn' : ''}</div>`;
    if (navigator.vibrate) navigator.vibrate(60);
    if (area === 'qc' && r.to === 'In QC') { const u = await unitByQr(code); if (u) box.innerHTML += `<a class="btn st" style="margin-top:14px;width:100%" href="#/qc/${u.id}">${icon.clip} Inspect this unit</a>`; }
  } catch (e) {
    const m = errMsg(e);
    box.className = 'result bad';
    box.innerHTML = `<span class="bdg red">STOP</span><div class="big" style="font-size:22px">${esc(m)}</div>`;
    if (/In QC/.test(m)) { const u = await unitByQr(code); if (u) box.innerHTML += `<a class="btn st" style="margin-top:14px;width:100%" href="#/qc/${u.id}">${icon.clip} Inspect this unit</a>`; }
    if (/Sign in/.test(m)) store.del('session.'+area);
    if (navigator.vibrate) navigator.vibrate([80,60,80]);

function progressBar(j){

  return `<div class="bar">${AREA_ORDER.filter(a => pa[a]).map(a => `<i style="width:${100*pa[a]/tot}%;background:${areaColor(a)}" title="${esc(AREAS[a]||'Shipped')} ${pa[a]}"></i>`).join('')}${(j.pieces_done||0) > 0 && !pa.ship && !pa.done ? '' : ''}</div>`;
}
function compState(j){
  if (holdKind(j.id)) return ['blocked', holdKind(j.id), 'red'];
  if (j.hardware_short) return ['warn', 'HARDWARE SHORT', 'amber'];
  if ((j.pieces_done||0) >= j.qty) return ['done', 'COMPLETE', 'green'];
  const pa = j.pieces_by_area || {}; const floor = Object.keys(pa).filter(a => !['office','done'].includes(a));
  if (!floor.length) return ['idle', 'NOT STARTED', ''];
  const lead = AREA_ORDER.filter(a => pa[a] && a !== 'done').pop();
  return ['a-' + lead, 'ACTIVE · ' + (AREAS[lead]||'').toUpperCase(), 'st'];
}

async function drawingsFor(j){

/* ---------- print ribbons: customer print, bend prints, assembly, nest (from engineering) ---------- */
const PTABS = [['customer', 'Customer print'], ['bend', 'Bend prints'], ['assembly', 'Assembly'], ['nest', 'Nest']];
async function engPrintsFor(j){
  const out = { bend: [], assembly: [], nest: [] };
  const itemKey = String(j.rfq_line || '').split(':')[0];
  const qs = [];
  // only engineering released to production, and only its files at the current revision (older ones are history)
  const cols = 'kind,files,status,approved_name,current_rev,released_at,updated_at';
  if (j.rfq_id && itemKey) qs.push(sb.from('eng_tasks').select(cols).eq('kind', 'job').eq('rfq_id', j.rfq_id).eq('item_key', itemKey));
  if (j.part_key) qs.push(sb.from('eng_tasks').select(cols).eq('kind', 'compartment').eq('part_key', j.part_key).eq('status', 'approved'));
  for (const { data } of await Promise.all(qs)) for (const t of data || []) {
    if (t.kind === 'job' && !t.released_at) { out.held = true; continue; }
    for (const f of t.files || []) if (out[f.type] && !f.removed_at && (f.rev || '') === (t.current_rev || '')) out[f.type].push({ ...f, signed: true, rev: t.current_rev });
  }
  for (const k of ['bend', 'assembly', 'nest']) out[k].sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  return out;
}
async function printView(j, latest){
  S.engPrints = await engPrintsFor(j).catch(() => ({ bend: [], assembly: [], nest: [] }));
  if (S.printJob !== j.id) { S.printJob = j.id; S.printTab = 'customer'; S.printIdx = 0; }
  const n = k => k === 'customer' ? (latest ? 1 : 0) : S.engPrints[k].length;
  const ribbon = `<div class="pribbon">${PTABS.map(([k, l]) => `<button data-ptab="${k}" class="${S.printTab === k ? 'on' : ''}" ${n(k) ? '' : 'disabled'}>${l}<small>${k === 'customer' ? (latest ? 'REV ' + esc(latest.rev || '?') : '—') : n(k) || '—'}</small></button>`).join('')}</div>`;
  if (S.printTab === 'customer') { S.printDoc = latest ? { path: latest.storage_path, page: 1, bucket: 'documents' } : null; return ribbon + printPane(latest); }

  </div></div>`;
  const cv = $('#sigPad'); const ratio = window.devicePixelRatio || 1;

  cv.onpointerdown = ev => { drawing = true; cv.setPointerCapture(ev.pointerId); const [x, y] = pt(ev); g.beginPath(); g.moveTo(x, y); };
  cv.onpointermove = ev => { if (!drawing) return; const [x, y] = pt(ev); g.lineTo(x, y); g.stroke(); ink++; if (ink > 12) $('#sigOk').disabled = false; };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  const tick2 = setInterval(() => { const el = $('#sigStamp'); if (el) el.textContent = stamp(); else clearInterval(tick2); }, 1000);

}

async function turnPrint(dir){

    const to = sib[k + dir]; if (to) { location.hash = '#/prints/' + to.id; return; }

document.addEventListener('touchstart', e => { const dw = e.target.closest('.dwg'); swipeStart = dw && e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, dw } : null; }, { passive: true });
document.addEventListener('touchend', e => {
  const st = swipeStart; swipeStart = null; if (!st) return;
  const t = e.changedTouches[0]; const dx = t.clientX - st.x, dy = t.clientY - st.y;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  swipedAt = Date.now(); const dir = dx < 0 ? 1 : -1;
  if (st.dw.id === 'qcDwg') { if (QC.pages > 1) { const np = Math.max(1, Math.min(QC.pages, QC.page + dir)); if (np !== QC.page) { QC.page = np; qcRender(); } } return; }

}, { passive: true });

/* ---------- jobs in shorthand: 6 compartments · 2 wall plates ---------- */
function kindOf(descr){
  const d = String(descr || '').toUpperCase();
  if (/WALL ?PLATE/.test(d)) return ['wall plate', 'wall plates'];
  if (/BAND ?CLAMP/.test(d)) return ['band clamp', 'band clamps'];
  if (/CLAMP/.test(d)) return ['clamp', 'clamps'];
  if (/COMPARTMENT|ENCLOSURE|CABINET|HOUSING/.test(d)) return ['compartment', 'compartments'];
  if (/COVER|LID|DOOR/.test(d)) return ['cover', 'covers'];
  if (/BRACKET/.test(d)) return ['bracket', 'brackets'];
  if (/PLATE|PANEL/.test(d)) return ['plate', 'plates'];
  return ['other part', 'other parts'];
}
function shorthand(list){
  const m = new Map();
  for (const x of list) { const [one, many] = kindOf(x.descr); const q = Number(x.qty) || 0; const c = m.get(one) || { one, many, n: 0 }; c.n += q; m.set(one, c); }
  return [...m.values()].sort((a, b) => b.n - a.n).map(c => `${c.n} ${c.n === 1 ? c.one : c.many}`).join(' · ') || 'No parts listed';
}

const QC = { unit:null, job:null, insp:null, rows:[], dw:null, page:1, pages:1, sel:null, entry:null, adding:false, vp:null };
function parseDim(raw, mm){
  let s = String(raw).trim().replace(/["”″]/g,'').replace(/^\(?\d+\s*[xX]\s+/,'').replace(/\s*(±|\+\/-|\+|TYP|REF).*$/i,'').replace(/^[ØR]\s?/,'').trim();
  let m;
  if ((m = s.match(/^(\d+(?:\.\d+)?)\s*°$/))) return { v: +m[1], type:'angle' };
  if ((m = s.match(/^(\d+)[ -](\d+)\/(\d+)$/))) return { v: +m[1] + (+m[2])/(+m[3]), type:'linear' };
  if ((m = s.match(/^(\d+)\/(\d+)$/)) && +m[2] <= 64) return { v: (+m[1])/(+m[2]), type:'linear' };
  if ((m = s.match(/^(\d*\.\d+)$/))) return { v: +m[1], type:'linear' };
  if (mm && (m = s.match(/^(\d{1,4})$/))) return { v: +m[1], type:'linear' };
  return null;
}

/* ================= ROUTER ================= */
const LIVE = new Set(['map','station','folder','job','waiting','qcpick','home','holds','workers','pack']);
let renderSeq = 0, curRoute = '';
function areaForRoute(parts){ return parts[0]==='station' || parts[0]==='scan' ? parts[1] : parts[0]==='qc' || parts[0]==='qcpick' ? 'qc' : null; }
async function render(mode){
  const fromNav = mode === 'nav';
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const parts = h.split('/');
  if (mode === 'live' && !LIVE.has(parts[0]) && curRoute === h) { renderHot(areaForRoute(parts)); return; }
  if ((curRoute.startsWith('scan') || curRoute.startsWith('lookup')) && h !== curRoute) await stopScanner();
  curRoute = h;
  const seq = ++renderSeq;
  const app = $('#app');
  document.body.dataset.area = ({ map:'map', waiting:'waiting', office:'office', holds:'hold', workers:'office', qc:'qc', qcpick:'qc', pack:'ship', stock:'laser' })[parts[0]] || (['station','scan'].includes(parts[0]) ? parts[1] : 'none');
  if (!S.user) { app.innerHTML = V.login(); $('#hot').innerHTML = ''; return; }
  if (!S.loaded) { app.innerHTML = '<main><div class="empty" style="margin-top:20vh">Loading the shop…</div></main>'; return; }
  let html;
  try {
    switch (parts[0]) {
      case 'map': html = V.map(); break;
      case 'station': html = AREAS[parts[1]] ? V.station(parts[1]) : V.map(); break;
      case 'scan': html = V.scan(parts[1]); break;
      case 'folder': html = await V.folder(parts[1]); break;
      case 'job': html = await V.job(parts[1]); break;
      case 'prints': html = await V.prints(parts[1]); break;
      case 'labels': html = await V.labels(parts[1]); break;
      case 'folderlabels': html = await V.folderlabels(parts[1]); break;
      case 'lookup': html = V.lookup(); break;
      case 'unit': html = await V.unit(parts[1]); break;
      case 'install': html = V.install(); break;
      case 'stock': html = await V.stock(decodeURIComponent(parts[1] || 'surplus')); break;
      case 'pack': html = await V.pack(parts[1]); break;
      case 'waiting': html = await V.waiting(); break;
      case 'qcpick': html = V.qcpick(); break;
      case 'qc': html = await V.qc(parts[1]); break;
      case 'holds': html = V.holds(); break;
      case 'office': html = await V.office(); break;
      case 'workers': html = V.workers(); break;
      default: html = V.home();
    }
  } catch (e) { html = topbar('Something went wrong') + `<main><div class="result bad">${esc(errMsg(e))}</div></main>`; }
  if (seq !== renderSeq) return;
  const y = window.scrollY; app.innerHTML = html; if (!fromNav) window.scrollTo(0, y);
  tick();
  if (parts[0] === 'scan') startScanner(parts[1]);
  if (parts[0] === 'prints' || parts[0] === 'job' || parts[0] === 'unit') drawPrintPage();
  if (parts[0] === 'lookup') startLookup();
  if (parts[0] === 'install') { const b = $('#installBtn'); if (b) b.onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); }; }
  if (parts[0] === 'qc' && QC.insp && QC.dw) qcDraw();
  renderHot(areaForRoute(parts));
}

  if (!v) return; try { await rpc('tandem_set_hot', { p_folder: fid, p_hot: true, p_reason: v.reason.trim() }); toast('HOT sent to every screen', 'ok'); await load(); render(); } catch (e) { toast(errMsg(e), 'bad'); } }

  if (!e.target.closest('a, button, input, label, textarea, select')) { const c = e.target.closest('[data-href]'); if (c && !S.arrange) { location.hash = c.dataset.href; return; } }

    if (t.id === 'magic') { const email = $('#loginForm [name=email]').value.trim(); if (!email) return toast('Type your email first', 'bad');

    if (d.addnote) { const j = S.jById[d.addnote]; const v = await ask({ title:`${AREAS[d.area]} note for ${j.base_label}`, ok:'Save note', fields:[{ name:'body', label:'Note', type:'textarea', required:true, placeholder:'Tooling V12 / 0.875 die. Grain vertical.' }] });
      if (!v) return; const { error } = await sb.from('tandem_notes').insert({ kind:'note', area:d.area, job_id:j.id, folder_id:j.folder_id, body:v.body.trim() }); if (error) throw error; await load(); return render(); }

document.addEventListener('change', e => { if (e.target.dataset.holdpick) { S.holdPick ||= new Set(); e.target.checked ? S.holdPick.add(e.target.dataset.holdpick) : S.holdPick.delete(e.target.dataset.holdpick); } });
document.addEventListener('input', e => { if (e.target.id === 'holdNote') S.holdNote = e.target.value; if (e.target.id === 'qcNote' && QC.entry) QC.entry.note = e.target.value; });
document.addEventListener('submit', async e => {
  if (e.target.id === 'manual') { e.preventDefault(); const c = $('#manualCode').value.trim(); if (c) doScan(curRoute.split('/')[1], c); $('#manualCode').value = ''; }
  if (e.target.id === 'loginForm') { e.preventDefault(); const f = new FormData(e.target);
    let who = String(f.get('email')).trim().toLowerCase();
    if (!who.includes('@')) { const { data } = await sb.rpc('login_email', { p_user: who }); who = data || ''; }
    const { error } = who ? await sb.auth.signInWithPassword({ email: who, password: String(f.get('password')) }) : { error: { message: 'That username and PIN do not match' } };
    if (error) toast(errMsg(error), 'bad'); }
});
// drag to reorder on the shop map (mouse / desktop)
document.addEventListener('dragstart', e => { const c = e.target.closest('[data-drag]'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const c = e.target.closest('[data-drag]'); if (c) { e.preventDefault(); c.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest('[data-drag]'); if (c) c.classList.remove('drop'); });
document.addEventListener('drop', e => { const c = e.target.closest('[data-drag]'); if (!c) return; e.preventDefault(); c.classList.remove('drop');
  const from = e.dataTransfer.getData('text/plain'), to = c.dataset.drag; if (!from || from === to) return;
  const o = folderOrder().filter(x => x !== from); o.splice(o.indexOf(to), 0, from); reorder(o); });

/* ================= BOOT ================= */
async function initData(){
  const { data: m } = await sb.from('team_members').select('email,role,name').eq('email', S.user.email.toLowerCase()).maybeSingle();
  S.member = m;
  await Promise.all([load(), loadAvg().catch(() => {})]); subscribe();
}
let initP = null;
function ensureInit(){ if (!initP) initP = initData().catch(e => { initP = null; toast(errMsg(e), 'bad'); }); return initP; }
// Never await Supabase calls inside this callback (it holds the auth lock) - defer instead.
sb.auth.onAuthStateChange((ev, sess) => {
  const was = S.user?.id; S.user = sess?.user || null;
  setTimeout(async () => {
    if (S.user && S.user.id !== was) { await ensureInit(); if (!location.hash || location.hash === '#/') location.hash = '#/' + (store.get('home') || 'home'); render('nav'); }
    else if (!S.user && was) { initP = null; S.loaded = false; render('nav'); }
  }, 0);
});
(async () => {
  const { data: { session: s } } = await sb.auth.getSession();
  S.user = s?.user || null;
  if (!location.hash || location.hash === '#/') location.hash = '#/' + (store.get('home') || 'home');
  render('nav');
  if (S.user) { await ensureInit(); render('nav'); }
})();

</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
